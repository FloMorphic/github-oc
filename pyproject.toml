[project]
name = "inflow-github-oc-plugin"
version = "0.2.0"
description = "Inflowenger plugin node for GitHub over OpenConnector (FloMorphic Connect) — every curated GitHub action (repos, contents, branches, commits, issues, pull requests, reviews, releases, Actions, search) plus the security surface (alerts, branch protection, org members)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mehdi Shokohifar", email = "mehdi.shokohifar@gmail.com" }]
dependencies = [
    "inflowenger-plugin-sdk>=0.1.5",
    "nkeys>=0.2.0",  # nats-py needs it for JWT/.creds (INFRA_CRED) auth
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["github_oc*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
